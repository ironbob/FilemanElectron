# electron-builder config for the macOS DMG.
# Run via: npm run dist:mac   (or bash scripts/build-dmg.sh)
# Docs: https://www.electron.build/configuration/mac

appId: com.fileman.electron
productName: Fileman
copyright: Copyright © 2026 wangtianbao

directories:
  output: dist
  buildResources: build

# Ship only the compiled output + manifest. electron-builder always adds the
# (pruned) production node_modules on top, so native deps (sharp, ssh2,
# ffmpeg-static) come along automatically.
files:
  - out/**/*
  - package.json
  - "!**/.DS_Store"

asar: true
# Native binaries must live on real disk, not inside app.asar.
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
  - "**/ffmpeg-static/**"
  - "**/@img/**"

# Bundled mobile CLI tools — `adb` is auto-placed by scripts/fetch-adb.sh
# (invoked from build-dmg.sh; local Android SDK first, Google download as
# fallback). It lands at Contents/Resources/adb and is resolved at runtime by
# ToolPathResolver (bundled → $PATH → brew common prefixes). Per project
# decision, license compliance for bundled tools is out of scope.
extraResources:
  - from: build/tools/adb
    to: adb
    filter: ["**/*"]
  # hdc（HarmonyOS Device Connector）+ libusb_shared.dylib — OHOS 设备发现/文件
  # 适配/截图引擎。由 scripts/fetch-hdc.sh 从本机 OpenHarmony/DevEco SDK 投放到
  # build/tools/hdc/（hdc 无公开直链，本机无 SDK 时为空目录占位，打包不失败）。
  # 缺失时运行时 ToolPathResolver 退回 $PATH / SDK 目录探测 —— 打包态 GUI 应用
  # 无用户 $PATH，通常即 OHOS 连接不可用。
  - from: build/tools/hdc
    to: hdc
    filter: ["**/*"]
  # ripgrep（grep 内容搜索本地引擎）。放置 macOS 二进制（单文件，可执行）到
  # build/tools/rg/rg。缺省时 ToolPathResolver 回退 $PATH 的 rg，再退化为
  # 流式扫描引擎——打包不因缺文件失败（与 adb 同语义）。
  - from: build/tools/rg
    to: rg
    filter: ["**/*"]
  # 7zz（7-Zip 官方 CLI，mac universal 单文件）—— 7z 创建/解压与 rar 解压引擎。
  # 由 scripts/fetch-7zz.sh 从 ip7z/7zip release 投放到 build/tools/7zz/7zz。
  # 缺省时 ToolPathResolver 回退 $PATH/brew 的 7zz，再缺失则 7z/rar 能力不可用
  # （zip 流式创建走 fflate，不受影响）。
  - from: build/tools/7zz
    to: 7zz
    filter: ["**/*"]
  # iOS native addon + bundled libimobiledevice dylib chain (populated by
  # scripts/bundle-ios-dylibs.sh; empty dir if iOS addon not built → iOS disabled).
  - from: build/ios-native
    to: ios-native
    filter: ["**/*"]

# All native deps here are N-API prebuilt (sharp), pure-JS (ssh2), or plain
# binaries (ffmpeg-static) — none need compiling against Electron's ABI, so
# skip the rebuild step (faster, no Xcode toolchain required at pack time).
npmRebuild: false

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # Build for host arch only (faster, smaller). For a universal DMG, replace
  # the list below with:  target: [dmg]  and add  arch: [universal]
  target:
    - dmg
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: ${productName}-${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
